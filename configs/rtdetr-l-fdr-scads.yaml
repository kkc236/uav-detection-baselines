# Ultralytics RT-DETR-L graph with FDR and trainable adaptive support routing.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

backbone:
  - [-1, 1, HGStem, [32, 48]]
  - [-1, 6, HGBlock, [48, 128, 3]]
  - [-1, 1, DWConv, [128, 3, 2, 1, false]]
  - [-1, 6, HGBlock, [96, 512, 3]]
  - [-1, 1, DWConv, [512, 3, 2, 1, false]]
  - [-1, 6, HGBlock, [192, 1024, 5, true, false]]
  - [-1, 6, HGBlock, [192, 1024, 5, true, true]]
  - [-1, 6, HGBlock, [192, 1024, 5, true, true]]
  - [-1, 1, DWConv, [1024, 3, 2, 1, false]]
  - [-1, 6, HGBlock, [384, 2048, 5, true, false]]

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, false]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [None, 2, nearest]]
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, false]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [[21, 24, 27], 1, SCADSFDRRTDETRDecoder,
     [nc, [256, 256, 256],
      {hidden_dim: 256, num_queries: 300, num_decoder_layers: 6,
       reg_max: 32, reg_scale: 4.0, up: 0.5, cumulative: true,
       preliminary_box: true, private_seed: 10000,
       support_up_values: [0.25, 0.5, 1.0], support_router_hidden: 64,
       support_temperature: 1.0, support_private_seed: 20000}]]

fdr_loss:
  fgl_weight: 0.15
  supervise_pre_boxes: true
  scads_route_weight: 0.05
  scads_margin_ratio: 0.02
