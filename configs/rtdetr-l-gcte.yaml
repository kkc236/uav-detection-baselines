# GCTE-RTDETR: stock RT-DETR-L plus one decoder-output GCQF module.

nc: 10
scales:
  l: [1.00, 1.00, 1024]

gcte:
  enabled: true
  module: GCQF
  integration: decoder-output-wrapper
  num_local_views: 4
  queries_per_view: 300
  query_dim: 256
  num_heads: 8
  tile_ratio: 0.6
  residual_cap: 0.2
  residual_eta: 0.2
  stages:
    - GeometryQueryProjector
    - GlobalLocalQueryInteraction
    - AnchorConditionedResidualEvidenceGate
  sr_peg:
    local_trunk: [770, 256, 256]
    global_box_embedding: 64
    tiny_utility_head: true
    non_tiny_risk_head: true
    anchor_admission_head: true
    global_retain_head: true
  protect_global_non_tiny: true
  exact_anchor_fallback: true
  loss:
    quality: 1.0
    equivariance: 0.1
    residual: 0.01
    tiny_utility: 1.0
    non_tiny_risk: 2.0
    global_retain: 2.0
    anchor_admission: 1.0

backbone:
  - [-1, 1, HGStem, [32, 48]]
  - [-1, 6, HGBlock, [48, 128, 3]]
  - [-1, 1, DWConv, [128, 3, 2, 1, False]]
  - [-1, 6, HGBlock, [96, 512, 3]]
  - [-1, 1, DWConv, [512, 3, 2, 1, False]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]]
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]]

head:
  - [-1, 1, Conv, [256, 1, 1, null, 1, 1, False]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [7, 1, Conv, [256, 1, 1, null, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [3, 1, Conv, [256, 1, 1, null, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [[21, 24, 27], 1, RTDETRDecoder, [nc]]
