# RT-DETR-L plus the integrated GCMV-EI module before the stock decoder.

nc: 80
scales:
  l: [1.00, 1.00, 1024]

gcmv:
  enabled: true
  module: GCMV-EI
  semantic_p3_index: 21
  decoder_feature_indices: [21, 24, 27]
  global_imgsz: 640
  local_imgsz: 1088
  tile_ratio: 0.6
  views: [TL, TR, BL, BR]
  gglf:
    interaction_channels: 64
    num_heads: 4
    window_size: 3
  peg:
    residual_scalar_init: 0.0
    gate_logit_init: 0.0

backbone:
  - [-1, 1, HGStem, [32, 48]]
  - [-1, 6, HGBlock, [48, 128, 3]]
  - [-1, 1, DWConv, [128, 3, 2, 1, False]]
  - [-1, 6, HGBlock, [96, 512, 3]]
  - [-1, 1, DWConv, [512, 3, 2, 1, False]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]
  - [-1, 1, DWConv, [1024, 3, 2, 1, False]]
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]]

head:
  - [-1, 1, Conv, [256, 1, 1, null, 1, 1, False]]
  - [-1, 1, AIFI, [1024, 8]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [7, 1, Conv, [256, 1, 1, null, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 1, 1]]
  - [-1, 1, nn.Upsample, [null, 2, nearest]]
  - [3, 1, Conv, [256, 1, 1, null, 1, 1, False]]
  - [[-2, -1], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 17], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]]
  - [-1, 3, RepC3, [256]]
  - [[21, 24, 27], 1, RTDETRDecoder, [nc]]
